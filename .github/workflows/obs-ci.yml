name: obs-ci
on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats gnupg
      - run: shellcheck -x -s bash bin/obsctl lib/*.sh lib/modules/*.sh scripts/*.sh
      - run: bats tests/obsctl
      - run: docker compose --env-file /dev/null -f deploy/core/docker-compose.yml config -q
        env:
          OBS_VERSION: ci
          OBS_HOSTNAME: ci.example
          OBS_SECRETS_DIR: /tmp/secrets
          OBS_CORE_CONF_DIR: /tmp/conf

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && ruff check .
      - run: cd backend && python -m pytest -q
        env:
          OBS_TEST_ADMIN_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && (test -f package-lock.json && npm ci || npm install)
      - run: cd frontend && npm run lint && npm run build && npm test

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t obs/backend:ci backend
      - run: docker build -t obs/proxy:ci frontend
