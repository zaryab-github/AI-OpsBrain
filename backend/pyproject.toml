[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opsbrain-api"
version = "0.1.0"
description = "AI-OpsBrain platform API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy[asyncio]==2.0.40",
  "asyncpg==0.30.0",
  "alembic==1.15.2",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "email-validator==2.2.0",
  "argon2-cffi==23.1.0",
  "pyotp==2.9.0",
  "redis==5.2.1",
  "celery[redis]==5.5.1",
  "prometheus-client==0.21.1",
  "cryptography==44.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "httpx==0.28.1",
  "ruff==0.11.6",
]

[project.scripts]
opsbrain-admin = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S608", "E501"]
"alembic/*" = ["E501", "S608"]  # migration SQL uses validated identifiers only
